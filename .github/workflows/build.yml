name: Build Static Browser

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Build Windows
        run: npm run dist:win -- --publish never

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Static-Windows
          path: |
            release/**
            dist/**

  macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Build macOS
        run: npm run dist:mac -- --publish never

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: Static-macOS
          path: |
            release/**
            dist/**

  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Build Linux
        run: npm run dist:linux -- --publish never

      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: Static-Linux
          path: |
            release/**
            dist/**
