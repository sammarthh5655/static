<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none';" />
  <title>Omnibox suggestions</title>
  <style>
    /* This document is a transparent WebContentsView overlaid on the page,
       positioned by main under the omnibox. Only the panel is opaque. */
    html, body { margin: 0; background: transparent; overflow: hidden; }
    body { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #202124; user-select: none; }
    #panel {
      margin: 0 4px 8px 4px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(32, 33, 36, 0.28);
      padding: 6px 0;
      overflow: hidden;
    }
    .row {
      display: flex; align-items: center; gap: 12px;
      height: 36px; padding: 0 14px;
      cursor: default;
      white-space: nowrap;
    }
    .row.selected, .row:hover { background: #f1f3f4; }
    .row .ico { width: 18px; height: 18px; flex: 0 0 18px; fill: #5f6368; }
    .row .main { overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
    .row .sub { color: #5f6368; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
    .row .sub::before { content: "— "; }
    .row.kind-search .main { color: #202124; }
    .row.kind-url .main, .row.kind-history .main, .row.kind-bookmark .main { color: #1a0dab; }
  </style>
</head>
<body>
  <div id="panel"></div>
  <script src="dropdown.js"></script>
</body>
</html>
