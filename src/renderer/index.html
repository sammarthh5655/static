<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- style-src allows 'unsafe-inline' ONLY because <browser-action-list>,
       from electron-chrome-extensions, styles itself with inline styles and we
       do not control that code. script-src stays locked to 'self', which is the
       directive that actually matters here: this page has no remote origins,
       loads no user content, and renders nothing from the network. The
       browser:// pages keep the strict style-src 'self'. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data: chrome-extension: crx:; connect-src 'none'">
  <title>static</title>
  <link rel="stylesheet" href="chrome.css">
</head>
<body>
  <!-- Custom title bar. The whole bar is a drag region except the buttons,
       which opt out with -webkit-app-region: no-drag (see chrome.css). -->
  <div class="titlebar" id="titlebar">
    <div class="titlebar-left" id="titlebar-left">
      <button class="menu-trigger" id="app-menu" title="Menu (F10)"></button>
    </div>
    <div class="titlebar-drag" id="titlebar-drag">
      <span class="incognito-pill" id="incognito-pill" hidden>Incognito</span>
      <span class="titlebar-title" id="window-title">static</span>
    </div>
    <div class="window-controls" id="window-controls"></div>
  </div>

  <!-- Tab strip -->
  <div class="strip">
    <button class="strip-tool" id="workspace-switch" title="Switch workspace">Main</button>
    <div class="tabs" id="tabs"></div>
    <button class="icon-btn newtab" id="newtab" title="New tab"></button>
    <div class="strip-drag"></div>
    <button class="strip-tool" id="organise-tabs" title="Organise tabs (Ctrl+Shift+O)">Organise Tabs</button>
    <button class="icon-btn strip-search" id="tab-search" title="Search tabs"></button>
  </div>

  <!-- Toolbar: navigation, omnibox, extension actions -->
  <div class="toolbar">
    <button class="icon-btn" id="back" title="Back"></button>
    <button class="icon-btn" id="forward" title="Forward"></button>
    <button class="icon-btn" id="reload" title="Reload"></button>
    <button class="icon-btn" id="home" title="Home"></button>

    <div class="omnibox" id="omnibox">
      <span class="security" id="security"></span>
      <input id="address" type="text" spellcheck="false" autocomplete="off"
             placeholder="Search Google or type a URL">
      <!-- Page tools: a QR code of the address (shown while the pointer is on
           the bar), and the article on its own (offered only on articles).
           The QR code comes first so that, appearing, it moves nothing the
           pointer may be heading for. -->
      <button class="icon-btn omni-tool qr" id="qr" title="QR code for this page" hidden></button>
      <button class="icon-btn omni-tool reader" id="reader" title="Reading view" hidden></button>
      <button class="icon-btn key" id="key" title="Saved passwords for this site" hidden></button>
      <button class="icon-btn star" id="star" title="Bookmark this page"></button>
      <div class="suggestions" id="suggestions" hidden></div>
    </div>

    <!-- Populated by electron-chrome-extensions with real extension icons -->
    <browser-action-list id="actions"></browser-action-list>
    <button class="icon-btn" id="overflow" title="Menu"></button>
  </div>

  <!-- Bookmarks bar -->
  <div class="bookmarks" id="bookmarks" hidden></div>

  <div class="notice" id="notice" hidden></div>

  <script src="../shared/theme.js"></script>
  <script src="../shared/suggest.js"></script>
  <script src="../shared/motion.js"></script>
  <script src="ui.js"></script>
  <script src="chrome.js"></script>
</body>
</html>
