<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline';" />
  <title>Downloads</title>
  <link rel="stylesheet" href="/assets/pages.css" />
  <style>
    .dl { align-items: flex-start; padding: 12px 16px; }
    .dl .fileicon { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 6px; background: #e8f0fe; color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .dl .text .title { font-weight: 500; }
    .dl .text .title.done:hover { text-decoration: underline; cursor: pointer; }
    .dl .status { color: var(--muted); font-size: 12px; }
    .dl .status.err { color: var(--danger); }
    .bar { height: 4px; background: #e8eaed; border-radius: 2px; margin-top: 8px; overflow: hidden; width: 100%; max-width: 420px; }
    .bar > div { height: 100%; background: var(--accent); width: 0; transition: width 200ms; }
    .dl .actions { opacity: 1; }
    .dl .actions button { font-size: 12px; padding: 4px 10px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <h1>Downloads</h1>
      <button id="clear">Clear all</button>
    </div>
    <div id="results"></div>
  </div>
  <script src="/assets/pages.js"></script>
  <script src="/downloads.js"></script>
</body>
</html>
