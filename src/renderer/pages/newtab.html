<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https: http: data:; connect-src 'none'">
  <title>New tab</title>
  <link rel="stylesheet" href="pages.css">
  <link rel="stylesheet" href="newtab.css">
</head>
<body class="newtab">
  <!-- Ambient wash. Two soft radial pools rather than an image, so it costs
       nothing to paint and never competes with the text for attention. -->
  <div class="ambient"></div>

  <main class="stage">
    <header class="mark">
      <div class="mark-glyph" id="mark-glyph"></div>
      <h1 class="wordmark">static</h1>
    </header>

    <!-- The search box is the one thing this page is for. -->
    <form class="search" id="search" autocomplete="off">
      <span class="search-icon" id="search-icon"></span>
      <input id="query" type="text" spellcheck="false" autocomplete="off" autofocus
             placeholder="Search the web or press Tab for AI">
      <span class="search-badge" id="search-badge" hidden>AI</span>
    </form>

    <p class="keyhint" id="keyhint"></p>

    <!-- Only present once something has been asked. -->
    <section class="answer" id="answer" hidden>
      <header class="answer-head">
        <span class="answer-label" id="answer-label">Gemini</span>
        <button class="answer-tool" id="answer-open">Open in AI</button>
        <button class="answer-tool" id="answer-copy">Copy</button>
        <button class="answer-tool" id="answer-close">Close</button>
      </header>
      <div class="answer-text" id="answer-text"></div>
    </section>

    <!-- Five actions, no more. -->
    <nav class="actions" id="actions"></nav>

    <!-- Small round icons, no cards. -->
    <section class="frequent" id="frequent" hidden>
      <div class="frequent-row" id="frequent-row"></div>
    </section>

    <!-- One compact utility row. -->
    <section class="utility" id="utility"></section>
  </main>

  <aside class="tools" id="tools" hidden>
    <header class="tools-head">
      <span class="tools-title">AI tools</span>
      <button class="tools-close" id="tools-close" title="Close"></button>
    </header>
    <div class="tools-body" id="tools-body"></div>
  </aside>

  <script src="../../shared/theme.js"></script>
  <script src="../../shared/modes.js"></script>
  <script src="common.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
