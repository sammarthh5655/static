<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Settings</title>
  <link rel="stylesheet" href="pages.css">
</head>
<body>
  <div class="wrap">
    <h1>Settings</h1>

    <h2>Search</h2>
    <div class="card">
      <div class="field">
        <div>
          <label for="engine">Default search engine</label>
          <div class="hint">Used by the address bar and the new tab page.</div>
        </div>
        <div class="control">
          <select id="engine">
            <option value="google">Google</option>
            <option value="brave">Brave Search</option>
          </select>
        </div>
      </div>
    </div>

    <h2>Startup and new tabs</h2>
    <div class="card">
      <div class="field">
        <div>
          <label for="behavior">New tab opens</label>
          <div class="hint">What Ctrl+T and the + button load.</div>
        </div>
        <div class="control">
          <select id="behavior">
            <option value="newtab">New tab page</option>
            <option value="homepage">Homepage</option>
          </select>
        </div>
      </div>
      <div class="field">
        <div>
          <label for="homepage">Homepage</label>
          <div class="hint">Opened by the home button.</div>
        </div>
        <div class="control"><input id="homepage" type="text" spellcheck="false"></div>
      </div>
    </div>

    <h2>Appearance</h2>
    <div class="card">
      <div class="field">
        <label for="bookmarksBar">Show bookmarks bar</label>
        <div class="control right">
          <input id="bookmarksBar" type="checkbox" class="toggle">
        </div>
      </div>
    </div>

    <h2>Extensions</h2>
    <div class="card">
      <div class="field">
        <div>
          <label>Manage extensions</label>
          <div class="hint">Install, disable or remove Chrome extensions.</div>
        </div>
        <div class="control right">
          <button id="extensions">Open extensions</button>
        </div>
      </div>
    </div>

    <h2>Privacy</h2>
    <div class="card">
      <div class="checks">
        <label><input type="checkbox" id="clear-history" checked> Browsing history</label>
        <label><input type="checkbox" id="clear-cookies"> Cookies and site data</label>
        <label><input type="checkbox" id="clear-cache"> Cached files and images</label>
        <label><input type="checkbox" id="clear-downloads"> Download history</label>
      </div>
      <div class="field">
        <div class="hint" id="clear-status">Choose what to remove, then clear.</div>
        <div class="control right">
          <button id="clear" class="danger">Clear browsing data</button>
        </div>
      </div>
    </div>
  </div>
  <script src="common.js"></script>
  <script src="settings.js"></script>
</body>
</html>
