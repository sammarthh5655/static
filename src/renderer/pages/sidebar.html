<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>Sidebar</title>
  <link rel="stylesheet" href="pages.css">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body class="sidebar">
  <!-- The modes rail. Which modes appear, and in what order, is the user's
       choice - Customise opens the picker below. -->
  <nav class="side-rail" id="rail" aria-label="Modes">
    <div class="side-rail-items" id="rail-items"></div>
    <button class="side-rail-edit" id="rail-edit" title="Choose which modes appear here"
            aria-label="Customise the sidebar">Customise</button>
  </nav>

  <!-- The customise sheet, hidden until asked for. -->
  <section class="side-customise" id="customise" hidden aria-label="Choose sidebar modes">
    <div class="side-customise-head">
      <span>Show in the sidebar</span>
      <button class="side-tool" id="customise-done">Done</button>
    </div>
    <div class="side-customise-list" id="customise-list"></div>
  </section>

  <!-- A mode's summary, shown in place rather than by navigating away. -->
  <section class="side-panel" id="panel" hidden aria-label="Mode details"></section>

  <header class="side-head">
    <span class="side-title">AI</span>
    <button class="side-tool" id="new-chat" title="New chat">New</button>
    <button class="side-tool" id="open-full" title="Open the full AI page">Open</button>
    <button class="side-tool" id="close" title="Close sidebar" aria-label="Close sidebar">×</button>
  </header>

  <!-- What the AI can currently see. Always visible, never a hidden state:
       a sidebar that can read the page must say so plainly. -->
  <div class="side-permission" id="permission">
    <span class="perm-dot" id="perm-dot"></span>
    <span class="perm-text" id="perm-text">Checking this page…</span>
  </div>

  <!-- Quick actions for the current page. -->
  <div class="side-actions" id="actions"></div>

  <div class="side-transcript" id="transcript"></div>

  <form class="side-compose" id="compose" autocomplete="off">
    <textarea id="input" rows="2" placeholder="Ask about this page…"
              spellcheck="false" aria-label="Ask the AI"></textarea>
    <button type="submit" id="send" class="side-send">Send</button>
  </form>

  <script src="../../shared/theme.js"></script>
  <script src="common.js"></script>
  <script src="../../shared/modes.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
