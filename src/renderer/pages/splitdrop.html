<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Split drop zones</title>
  <link rel="stylesheet" href="splitdrop.css">
</head>
<!-- Shown over the page only while a tab is being dragged: let go on the
     left or right half to open it on that side of split view. -->
<body>
  <div class="zone" data-side="left">
    <div class="card">
      <span class="glyph" aria-hidden="true"><i class="pane mine"></i><i class="pane"></i></span>
      <span class="text">Open on the left</span>
    </div>
  </div>
  <div class="zone" data-side="right">
    <div class="card">
      <span class="glyph" aria-hidden="true"><i class="pane"></i><i class="pane mine"></i></span>
      <span class="text">Open on the right</span>
    </div>
  </div>
  <script src="../../shared/theme.js"></script>
  <script src="common.js"></script>
  <script src="splitdrop.js"></script>
</body>
</html>
