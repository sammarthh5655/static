<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>Dangerous site ahead</title>
  <link rel="stylesheet" href="pages.css">
  <link rel="stylesheet" href="warning.css">
</head>
<!-- browser://warning: Safe Browsing, certificate and HTTPS-only warnings.
     What it is about comes from main by token (features/netguard), never
     from the address, so a page cannot dress up a warning of its own. -->
<body class="wn" data-tone="danger">
  <div class="wn-glow" aria-hidden="true"></div>
  <main class="wn-card" id="card" aria-labelledby="title" hidden>
    <div class="wn-emblem" id="emblem" aria-hidden="true"></div>
    <p class="wn-eyebrow" id="eyebrow"></p>
    <h1 class="wn-title" id="title"></h1>
    <p class="wn-host" id="host-line"><span id="host"></span></p>
    <p class="wn-lede" id="lede"></p>
    <ul class="wn-reasons" id="reasons" hidden></ul>
    <div class="wn-actions">
      <button type="button" class="wn-primary" id="back">Back to safety</button>
      <button type="button" class="wn-quiet" id="plain-continue" hidden></button>
      <button type="button" class="wn-quiet" id="details-toggle" aria-expanded="false" aria-controls="details">Details</button>
    </div>
    <section class="wn-details" id="details" aria-label="Details" hidden>
      <dl class="wn-facts" id="facts"></dl>
      <div class="wn-risk" id="risk" hidden>
        <p id="risk-text"></p>
        <button type="button" class="wn-link" id="continue"></button>
        <div class="wn-confirm" id="confirm" hidden>
          <p id="confirm-text"></p>
          <div class="wn-confirm-actions">
            <button type="button" class="wn-danger" id="confirm-yes">Open it anyway</button>
            <button type="button" class="wn-quiet" id="confirm-no">Cancel</button>
          </div>
        </div>
      </div>
    </section>
    <p class="wn-foot" id="foot"></p>
  </main>
  <script src="../../shared/theme.js"></script>
  <script src="common.js"></script>
  <script src="warning.js"></script>
</body>
</html>
