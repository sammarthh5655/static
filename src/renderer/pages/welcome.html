<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Welcome to Static</title>
  <link rel="stylesheet" href="pages.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="welcome.css">
</head>
<body class="welcome-body">
  <!-- Three slow colour fields, blurred far past their own size so they read
       as light in fog rather than as shapes. Pure CSS: no WebGL, no library,
       and nothing the page's strict CSP has to make room for. -->
  <div class="welcome-aurora" aria-hidden="true">
    <div class="welcome-blob one"></div>
    <div class="welcome-blob two"></div>
    <div class="welcome-blob three"></div>
  </div>

  <!-- Drifting particles that lean away from the pointer. -->
  <canvas id="stars" aria-hidden="true"></canvas>

  <main class="welcome" role="main">
    <nav class="welcome-steps" id="steps" aria-label="Setup progress"></nav>

    <section class="welcome-panel" id="panel">
      <h1 id="title"></h1>
      <p class="welcome-lede" id="lede"></p>
      <div id="body"></div>
    </section>

    <!-- Skip stays visible on an optional step. A setup flow that hides its
         exit is one people learn to distrust. -->
    <footer class="welcome-actions">
      <button id="back" class="welcome-button">Back</button>
      <span class="welcome-spacer"></span>
      <button id="skip" class="welcome-button quiet">Skip this</button>
      <button id="next" class="welcome-button primary">Continue</button>
    </footer>
  </main>

  <script src="../../shared/theme.js"></script>
  <script src="../../shared/modes.js"></script>
  <script src="common.js"></script>
  <script src="widgets/planetarium.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
